name: Generate Profile Artifacts

on:
  push:
    branches:
      - main
      - feature/profile-readme-dashboard-fixes
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak and catapult SVGs
        run: python scripts/generate_profile_artifacts.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/streak.svg assets/animations/contribution-catapult.svg
          git diff --cached --quiet || git commit -m "Update generated profile artifacts"
          git push
