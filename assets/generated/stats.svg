  <rect x="10" y="10" width="320" height="200" rx="6" fill="#0d1117"/>
  <text x="170" y="40" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">GitHub Stats</text>
