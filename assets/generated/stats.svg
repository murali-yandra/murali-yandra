<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" role="img" aria-labelledby="stats-title stats-desc">
  <title id="stats-title">GitHub Stats</title>
  <desc id="stats-desc">11 public repos, 0 stars, 0 followers, on GitHub for 2 years.</desc>
