    <rect x="217.4" y="0" width="10.3" height="8" rx="1" fill="#3572A5"/>
    <rect x="227.7" y="0" width="2.0" height="8" rx="1" fill="#844fba"/>
    <rect x="229.7" y="0" width="2.0" height="8" rx="1" fill="#563d7c"/>
