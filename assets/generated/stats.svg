  <g transform="translate(30, 166)">
    <g transform="translate(0, 0)"><g transform="translate(0, 0)"><circle r="4" cx="4" cy="4" fill="#8b949e"/><text x="12" y="8" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">Jupyter Notebook 87%</text></g><g transform="translate(90, 0)"><circle r="4" cx="4" cy="4" fill="#3178c6"/><text x="12" y="8" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">TypeScript 7%</text></g><g transform="translate(180, 0)"><circle r="4" cx="4" cy="4" fill="#3572A5"/><text x="12" y="8" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">Python 4%</text></g></g>
    <g transform="translate(0, 20)"><g transform="translate(270, 0)"><circle r="4" cx="4" cy="4" fill="#844fba"/><text x="12" y="8" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">HCL 1%</text></g><g transform="translate(360, 0)"><circle r="4" cx="4" cy="4" fill="#563d7c"/><text x="12" y="8" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">CSS 0%</text></g></g>
