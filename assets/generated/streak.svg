<svg xmlns="http://www.w3.org/2000/svg" width="520" height="180" viewBox="0 0 520 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub streaks</title>
  <desc id="desc">GitHub streak card generated by GitHub Actions.</desc>
  <rect width="520" height="180" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="518" height="178" rx="18" fill="none" stroke="#30363d"/>
  <text x="28" y="42" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">GitHub Streaks</text>
  <text x="28" y="72" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">This card updates after the profile artifact workflow runs.</text>
  <g transform="translate(28 100)">
    <rect width="135" height="48" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" fill="#39d353" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Current</text>
    <rect x="154" width="135" height="48" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="172" y="30" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Longest</text>
    <rect x="308" width="155" height="48" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="326" y="30" fill="#a371f7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Contributions</text>
  </g>
</svg>
