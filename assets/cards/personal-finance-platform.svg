    <rect x="210" width="166" height="34" rx="17" fill="#1e3a8a"/><text x="293" y="22" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Merchant learning</text>
