    <rect x="336" y="48" width="134" height="34" rx="17" fill="#581c87"/><text x="403" y="70" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">AI categories</text>
