<svg xmlns="http://www.w3.org/2000/svg" width="490" height="430" viewBox="0 0 490 430" role="img" aria-labelledby="title">
  <title id="title">Personal Finance Tracking Platform</title>
  <rect width="490" height="430" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="488" height="428" rx="18" fill="none" stroke="#30363d"/>
  <path d="M0 0h490v116H0Z" fill="#052e16"/>
  <text x="28" y="47" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Personal Finance Tracking</text>
  <text x="28" y="78" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Private repository | Sprint 0 completed | Sprint 1 in progress</text>
  <g transform="translate(350 24)">
