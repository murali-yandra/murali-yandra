  <text x="44" y="135" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Data Engineer | SQL Expert | Cloud &amp; ETL Specialist</text>
  <text x="44" y="174" fill="#1e293b" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <tspan x="44" dy="0">Data Engineer at Accenture with 2+ years of experience designing, building,</tspan>
    <tspan x="44" dy="24">and optimizing scalable data pipelines and cloud data solutions. Passionate</tspan>
    <tspan x="44" dy="24">about transforming raw data into reliable insights and data-driven decisions.</tspan>
  </text>
