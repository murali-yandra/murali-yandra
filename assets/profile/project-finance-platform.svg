<svg xmlns="http://www.w3.org/2000/svg" width="535" height="360" viewBox="0 0 535 360" role="img" aria-labelledby="title">
  <title id="title">Personal Finance Tracking Platform</title>
  <rect width="535" height="360" rx="22" fill="#ffffff"/>
  <rect x="1" y="1" width="533" height="358" rx="22" fill="none" stroke="#dbe3ef"/>
  <text x="30" y="48" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Personal Finance Tracking Platform</text>
  <text x="30" y="82" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="14">Private repository</text>
  <text x="30" y="124" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="30" dy="0">Automated expense tracking, account reconciliation,</tspan>
    <tspan x="30" dy="23">merchant learning, and AI-assisted transaction</tspan>
    <tspan x="30" dy="23">categorization.</tspan>
  </text>
  <g transform="translate(30 210)">
    <rect width="82" height="28" rx="14" fill="#ecfdf5"/><text x="41" y="19" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">FastAPI</text>
    <rect x="92" width="102" height="28" rx="14" fill="#eff6ff"/><text x="143" y="19" text-anchor="middle" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">PostgreSQL</text>
    <rect x="204" width="92" height="28" rx="14" fill="#fff7ed"/><text x="250" y="19" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">SQLModel</text>
    <rect x="306" width="80" height="28" rx="14" fill="#f1f5f9"/><text x="346" y="19" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Alembic</text>
    <rect y="42" width="82" height="28" rx="14" fill="#eff6ff"/><text x="41" y="61" text-anchor="middle" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Docker</text>
    <rect x="92" y="42" width="138" height="28" rx="14" fill="#eff6ff"/><text x="161" y="61" text-anchor="middle" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">GitHub Actions</text>
    <rect x="240" y="42" width="82" height="28" rx="14" fill="#f1f5f9"/><text x="281" y="61" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Ollama</text>
    <rect x="332" y="42" width="136" height="28" rx="14" fill="#eff6ff"/><text x="400" y="61" text-anchor="middle" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">Telegram Bot</text>
  </g>
  <line x1="30" y1="300" x2="505" y2="300" stroke="#e2e8f0"/>
  <text x="30" y="328" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Status:</text>
  <text x="86" y="328" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="14">Sprint 0 completed | Sprint 1 in progress</text>
</svg>
