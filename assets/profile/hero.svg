<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">Murali Yandra profile hero</title>
  <desc id="desc">Murali Yandra, Data Engineer, SQL Expert, Cloud and ETL Specialist at Accenture in Bengaluru, India.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#075be8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1100" height="340" rx="24" fill="url(#paper)"/>
  <rect x="1" y="1" width="1098" height="338" rx="24" fill="none" stroke="#dbe3ef"/>
  <g transform="translate(52 46)">
    <text x="0" y="0" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Hi, I'm</text>
    <text x="0" y="58" fill="url(#ink)" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="850">Murali Yandra</text>
    <rect x="0" y="78" width="680" height="3" rx="2" fill="url(#blue)"/>
    <text x="0" y="124" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="750">Data Engineer | SQL Expert | Cloud &amp; ETL Specialist</text>
    <text x="0" y="166" fill="#1e293b" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      <tspan x="0" dy="0">I design reliable ETL pipelines, tune SQL workloads, and modernize legacy</tspan>
      <tspan x="0" dy="26">data workflows into cloud-ready platforms that turn raw data into decisions.</tspan>
    </text>
    <g transform="translate(0 238)">
      <rect width="160" height="38" rx="19" fill="#eff6ff"/>
      <path d="M18 17c0-7 5-12 12-12s12 5 12 12c0 9-12 22-12 22S18 26 18 17Z" fill="#2563eb"/>
      <circle cx="30" cy="17" r="4" fill="#ffffff"/>
      <text x="54" y="24" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Bengaluru</text>
      <rect x="176" width="136" height="38" rx="19" fill="#f5f3ff"/>
      <path d="M198 11 219 19 198 29" fill="none" stroke="#a100ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="234" y="24" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Accenture</text>
      <rect x="328" width="164" height="38" rx="19" fill="#ecfdf5"/>
      <text x="350" y="24" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">Production ETL</text>
    </g>
  </g>
  <g transform="translate(818 50)" filter="url(#shadow)">
    <rect width="230" height="240" rx="22" fill="#0f172a"/>
    <rect x="1" y="1" width="228" height="238" rx="22" fill="none" stroke="#334155"/>
    <text x="28" y="42" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">DATA CONSOLE</text>
    <rect x="28" y="64" width="174" height="1" fill="#334155"/>
    <g transform="translate(28 92)">
      <rect width="52" height="52" rx="14" fill="#e0f2fe"/>
      <path d="M16 39V17l10 6v10l8-5v9l9-5v26H16Z" fill="#0078d4"/>
      <rect x="72" width="52" height="52" rx="14" fill="#eef2ff"/>
      <ellipse cx="98" cy="17" rx="17" ry="6" fill="#2563eb"/>
      <path d="M81 17v24c0 4 8 6 17 6s17-2 17-6V17" fill="#2563eb"/>
      <rect x="144" width="52" height="52" rx="14" fill="#fff7ed"/>
      <path d="M170 9 177 26 195 21 181 35 190 52 170 44 151 53 159 35 145 21 163 26Z" fill="none" stroke="#f97316" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(28 176)">
      <rect width="196" height="38" rx="10" fill="#111827" stroke="#334155"/>
      <circle cx="22" cy="19" r="5" fill="#22c55e"/>
      <text x="38" y="24" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">pipelines: monitored</text>
    </g>
  </g>
</svg>
