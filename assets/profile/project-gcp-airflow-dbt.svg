<svg xmlns="http://www.w3.org/2000/svg" width="535" height="360" viewBox="0 0 535 360" role="img" aria-labelledby="title">
  <title id="title">GCP Airflow DBT Pipeline</title>
  <rect width="535" height="360" rx="22" fill="#ffffff"/>
  <rect x="1" y="1" width="533" height="358" rx="22" fill="none" stroke="#dbe3ef"/>
  <text x="30" y="48" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">GCP Airflow DBT Pipeline</text>
  <text x="30" y="82" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="14">Public repository</text>
  <text x="30" y="124" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <tspan x="30" dy="0">End-to-end data pipeline on Google Cloud using Airflow</tspan>
    <tspan x="30" dy="23">orchestration, dbt transformations, BigQuery analytics,</tspan>
    <tspan x="30" dy="23">Python, and SQL.</tspan>
  </text>
  <g transform="translate(30 214)">
    <rect width="78" height="30" rx="15" fill="#eff6ff"/><text x="39" y="20" text-anchor="middle" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Airflow</text>
    <rect x="88" width="58" height="30" rx="15" fill="#fff7ed"/><text x="117" y="20" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">DBT</text>
    <rect x="156" width="88" height="30" rx="15" fill="#eff6ff"/><text x="200" y="20" text-anchor="middle" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">BigQuery</text>
    <rect x="254" width="60" height="30" rx="15" fill="#ecfdf5"/><text x="284" y="20" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">GCP</text>
    <rect x="324" width="74" height="30" rx="15" fill="#eef2ff"/><text x="361" y="20" text-anchor="middle" fill="#4338ca" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">Python</text>
    <rect x="408" width="54" height="30" rx="15" fill="#f1f5f9"/><text x="435" y="20" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">SQL</text>
  </g>
  <line x1="30" y1="282" x2="505" y2="282" stroke="#e2e8f0"/>
  <text x="30" y="316" fill="#075be8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">github.com/murali-yandra/gcp-airflow-dbt-pipeline</text>
</svg>
