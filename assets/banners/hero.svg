<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Murali Yandra profile hero</title>
  <desc id="desc">Dashboard hero for Murali Yandra, Data Engineer, SQL Expert, Cloud and ETL Specialist in Bengaluru, India at Accenture.</desc>
  <defs>
