  <circle cx="876" cy="62" r="86" fill="#1f2937" opacity=".9"/>
  <circle cx="875" cy="62" r="60" fill="#0f172a"/>
  <path d="M820 66h112" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
